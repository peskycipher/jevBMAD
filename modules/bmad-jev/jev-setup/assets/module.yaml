code: custom/bmad-jev
name: "Jev BMad Hybrid"
description: "System-1/System-2 decision layer for BMad: typed, calibrated Jev decisions (choice/score/noul) with conservative escalation, batched phase-readiness gates, and Jev-as-judge story review"
module_version: 1.0.0
default_selected: false
module_greeting: >
  Jev BMad Hybrid is ready. Fast, calibrated System-1 decisions with
  conservative escalation — evaluation-first, audit-logged, and never
  force-fitting an answer.

# Displayed after install for modules the installer's external-module
# registry knows about. Custom-source modules are not in that registry yet
# (upstream: listAvailable() reads only the bundled/remote registry), so this
# does not display today; kept as the correct hook for when it does.
post_install_message: >
  Next step: configure the Jev decision layer. Run the jev-setup skill
  (/jev-setup) to set your API key and verify the runtime, or manage
  configuration directly with the jev_mode.py helper / /jev-mode command
  (mode defaults to "off" - zero network calls - until you change it).
