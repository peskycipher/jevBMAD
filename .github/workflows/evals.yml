name: evals

# CI regression gate (implementation.md §10): every push touching the golden
# sets, criteria, thresholds, or runtime modules re-runs the evals and fails
# on accuracy regression, calibration drift, or model drift.
# Skips the golden-set gate cleanly when no OPENROUTER_API_KEY secret is
# available (the no-key unit tests still run).

on:
  push:
    paths:
      - "evals/**"
      - "router/**"
      - "modules/**"
      - "_bmad/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "evals/**"
      - "router/**"
      - "modules/**"
      - "_bmad/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: CI eval gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx evals/harness/ci_gate.ts
