name: evals

# CI regression gate (implementation.md §10): every push touching the golden
# sets, criteria, thresholds, or runtime modules re-runs the evals and fails
# on accuracy regression, calibration drift, or model drift.
# Skips cleanly when no OPENROUTER_API_KEY secret is available.

on:
  push:
    paths:
      - "evals/**"
      - "router/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "evals/**"
      - "router/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CI eval gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 evals/harness/ci_gate.py
